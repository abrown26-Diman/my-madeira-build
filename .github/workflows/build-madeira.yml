name: Build Madeira IPA

on:
  workflow_dispatch:
  push:
    branches: [codex/madeira-ipa-build]

permissions:
  contents: read

concurrency:
  group: madeira-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkg-config autoconf automake libtool bison flex
          xcodebuild -version
          mkdir -p build/ci-logs

      - name: Identify toolchain cache
        id: cache-id
        run: |
          version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "prefix=madeira-v1-${{ runner.arch }}-$version-" >> "$GITHUB_OUTPUT"

      - name: Restore dependency build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains
            research/freetype
            FEX/build-ios
            wine/build-macos
            wine/build-arm64ec
            build/freetype-ios/build
            build/gnutls-ios/obj
          key: ${{ steps.cache-id.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cache-id.outputs.prefix }}

      - name: Prepare cross-compilers and source dependencies
        run: bash scripts/ci-build.sh prepare 2>&1 | tee build/ci-logs/prepare.log

      - name: Build FEX for iOS
        run: bash scripts/ci-build.sh fex 2>&1 | tee build/ci-logs/fex.log

      - name: Generate Wine tools and headers
        run: bash scripts/ci-build.sh wine-headers 2>&1 | tee build/ci-logs/wine-headers.log

      - name: Build native Wine and supporting libraries
        run: bash scripts/ci-build.sh native 2>&1 | tee build/ci-logs/native.log

      - name: Build LLVM 15 for iOS
        run: bash scripts/ci-build.sh llvm 2>&1 | tee build/ci-logs/llvm.log

      - name: Build DXMT Metal and shader translation libraries
        run: bash scripts/ci-build.sh dxmt 2>&1 | tee build/ci-logs/dxmt.log

      - name: Build and package unsigned IPA
        run: bash scripts/ci-build.sh app 2>&1 | tee build/ci-logs/app.log

      - name: Upload IPA and JIT script
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-IPA
          path: |
            build/ipa/Madeira-unsigned.ipa
            app/Madeira/madeira-jit.js
          if-no-files-found: error

      - name: Show captured compiler errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(set(Path('build').rglob('*.err')) | set(Path('build').rglob('err-*.txt')))
          files += list(Path('build/gnutls-ios/obj').glob('*-configure.log'))
          for path in [p for p in files if p.stat().st_size][-30:]:
              print(f'\n{path}:')
              print('\n'.join(path.read_text(errors='replace').splitlines()[-100:]))
          PY

      - name: Save dependency build cache
        if: always() && !cancelled() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains
            research/freetype
            FEX/build-ios
            wine/build-macos
            wine/build-arm64ec
            build/freetype-ios/build
            build/gnutls-ios/obj
          key: ${{ steps.cache-id.outputs.prefix }}${{ github.sha }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-build-logs
          path: |
            build/ci-logs
            build/**/*.err
            build/**/err-*.txt
            build/**/*.log
            wine/build-macos/config.log
            FEX/build-ios/CMakeFiles/CMakeConfigureLog.yaml
            toolchains/llvm-*-build/CMakeFiles/CMakeConfigureLog.yaml
            build/DerivedData/Logs
          if-no-files-found: ignore
